# Window title rules should come first because AeroSpace stops
# after the first matching callback.

[[on-window-detected]]
if = 'test %{window-title} ~= testing'                 # case intensitive regex match
run = ['layout floating', 'move-node-to-workspace 10 --focus-follows-window']

# Utilities

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.macpaw.CleanMyMac4'
run = ['layout floating', 'move-node-to-workspace 1 --focus-follows-window']

# Terminals → workspace 1

[[on-window-detected]]
