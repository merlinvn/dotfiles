# ============================================================
# Shell
# ============================================================

set -g default-shell "$SHELL"


# ============================================================
# General
# ============================================================

# Reduce ESC delay, useful with Vim/Neovim
set -sg escape-time 1

# Windows/panes start at 1
set -g base-index 1
setw -g pane-base-index 1

# Terminal / true color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Cursor shape
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Underline colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Vi-style tmux modes
set -g status-keys vi
setw -g mode-keys vi

# No activity alerts
setw -g monitor-activity off
setw -g visual-activity off

# Mouse support
set -g mouse on

# Clipboard support
set -g set-clipboard on


# ============================================================
# Reload config
# ============================================================

bind r source-file ~/.config/tmux/tmux.conf \; \
    display-message "tmux config reloaded"


# ============================================================
# Mouse / scrolling
# ============================================================

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" \
    "send-keys -M" \
    "if -Ft= '#{pane_in_mode}' \
        'send-keys -M' \
        'select-pane -t=; copy-mode -e; send-keys -M'"

bind -n WheelDownPane \
    select-pane -t= \; send-keys -M

bind -n C-WheelUpPane \
    select-pane -t= \; copy-mode -e \; send-keys -M

bind -T copy-mode-vi C-WheelUpPane \
    send-keys -X halfpage-up

bind -T copy-mode-vi C-WheelDownPane \
    send-keys -X halfpage-down

bind -T copy-mode-emacs C-WheelUpPane \
    send-keys -X halfpage-up

bind -T copy-mode-emacs C-WheelDownPane \
    send-keys -X halfpage-down


# ============================================================
# Home / End keys
# ============================================================

bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"


# ============================================================
# Panes / windows
# ============================================================

# Split in current directory
bind '%' split-window -c '#{pane_current_path}' -h
bind '"' split-window -c '#{pane_current_path}'
bind '|' split-window -c '#{pane_current_path}' -h
bind '-' split-window -c '#{pane_current_path}'

# New window in current directory
bind c new-window -c '#{pane_current_path}'


# ============================================================
# Pane navigation
# ============================================================

# Prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + arrows
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D


# ============================================================
# Pane resizing
# ============================================================

bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5


# ============================================================
# Window navigation
# ============================================================

# Shift + arrows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Ctrl + Shift + arrows: swap windows
bind-key -n C-S-Left \
    swap-window -t -1 \; select-window -t -1

bind-key -n C-S-Right \
    swap-window -t +1 \; select-window -t +1


# ============================================================
# Custom commands
# ============================================================

bind -N "⌘+g lazygit" g \
    new-window \
    -c "#{pane_current_path}" \
    -n "🌳" \
    "lazygit 2> /dev/null"

bind -N "⌘+b build" b \
    split-window -v -l 10 \
    "make build; read"

bind -N "⌘+d test" t \
    split-window -v -l 10 \
    "make test; read"


# ============================================================
# Copy mode
# ============================================================

unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi v send-keys -X begin-selection

bind Escape copy-mode

unbind p
bind p paste-buffer

# macOS clipboard
if-shell "test $(uname) = Darwin" \
    "bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"

if-shell "test $(uname) = Darwin" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'"


# ============================================================
# Plugins
# ============================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.3.1'


# ============================================================
# Catppuccin
# ============================================================

set -g @catppuccin_flavor 'mocha'

set -g @catppuccin_window_status_style "basic"

# Compact window tabs
# set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_text " #W"
#
# set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_current_text " #W"

# Optional: remove flags to keep tabs clean
set -g @catppuccin_window_flags "none"

# Short clock
set -g @catppuccin_date_time_text " %H:%M"

# Let #W become the current application
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# Load Catppuccin
run ~/.tmux/plugins/tmux/catppuccin.tmux

# ============================================================
# Status line
# ============================================================

set -g status-left-length 50
set -g status-right-length 100

# Left: tmux session
set -g status-left "#{E:@catppuccin_status_session}"

# Right: application + time
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# ============================================================
# TPM must be last
# ============================================================

run '~/.tmux/plugins/tpm/tpm'
